[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparrow"
version = "0.1.0"
description = "Lightweight LLM gateway with transparent proxy, tracing, and log viewer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "sse-starlette>=2.0.0",
]

[project.scripts]
sparrow = "sparrow.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "respx>=0.22.0",
]
